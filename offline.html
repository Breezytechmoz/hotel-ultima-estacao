<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sem ligação</title>
    <link rel="icon" href="assets/img/icons/icon-192.png">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <main class="max-w-sm text-center bg-white p-8 rounded-lg shadow">
        <p class="text-5xl mb-4">📡</p>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Sem ligação à internet</h1>
        <p class="text-gray-600 text-sm mb-6">
            Para fazer ou cancelar uma reserva precisa de estar online.
            Verifique a sua ligação e tente novamente.
        </p>
        <button onclick="location.reload()"
                class="w-full bg-marca-700 hover:bg-marca-800 text-white font-semibold py-2 rounded">
            Tentar novamente
        </button>
    </main>
</body>
</html>
